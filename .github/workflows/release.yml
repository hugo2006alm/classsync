name: Release installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.18.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          app_version=$(awk '/^version:/{print $2}' apps/client/pubspec.yaml | cut -d+ -f1)
          test "${GITHUB_REF_NAME#v}" = "$app_version"
      - run: pnpm relay:check
      - working-directory: apps/client
        run: flutter pub get
      - working-directory: apps/client
        run: dart format --output=none --set-exit-if-changed lib test tool
      - working-directory: apps/client
        run: flutter analyze
      - working-directory: apps/client
        run: flutter test --coverage && dart run tool/check_coverage.dart coverage/lcov.info 50

  android:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - name: Require and restore Android signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > apps/client/android/app/classsync-release.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=classsync-release.jks"
          } > apps/client/android/key.properties
      - working-directory: apps/client
        run: flutter pub get
      - working-directory: apps/client
        run: flutter build apk --release
      - working-directory: apps/client
        run: flutter build appbundle --release
      - run: |
          cp apps/client/build/app/outputs/flutter-apk/app-release.apk ClassSync-Android.apk
          cp apps/client/build/app/outputs/bundle/release/app-release.aab ClassSync-Android.aab
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ClassSync-Android
          path: |
            ClassSync-Android.apk
            ClassSync-Android.aab

  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - working-directory: apps/client
        run: flutter pub get
      - working-directory: apps/client
        run: flutter build windows --release
      - name: Prepare Windows signing
        id: windows_signing
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $available = [bool]$env:CERTIFICATE_BASE64 -and [bool]$env:CERTIFICATE_PASSWORD
          "available=$($available.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF.StartsWith('refs/tags/') -and -not $available) {
            throw 'Windows signing secrets are required for tagged releases.'
          }
          if ($available) {
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\classsync.pfx", [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          }
      - name: Sign app executable
        if: steps.windows_signing.outputs.available == 'true'
        shell: pwsh
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter signtool.exe -Recurse | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f "$env:RUNNER_TEMP\classsync.pfx" /p $env:CERTIFICATE_PASSWORD apps\client\build\windows\x64\runner\Release\classsync.exe
      - run: choco install innosetup --version=6.7.1 --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $version = ((Select-String '^version:' apps\client\pubspec.yaml).Line.Split()[1]).Split('+')[0]
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" packaging\windows\classsync.iss
      - name: Sign installer
        if: steps.windows_signing.outputs.available == 'true'
        shell: pwsh
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter signtool.exe -Recurse | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          $installers = @(Get-ChildItem dist -Filter 'ClassSync-Setup-*.exe')
          if ($installers.Count -ne 1) { throw "Expected one installer, found $($installers.Count)." }
          $installer = $installers[0].FullName
          & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f "$env:RUNNER_TEMP\classsync.pfx" /p $env:CERTIFICATE_PASSWORD $installer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ClassSync-Windows
          path: dist/*.exe

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: release/*
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: release/*
          generate_release_notes: true
