name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "31 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: semgrep/semgrep-rules
          ref: 40b8c63f75dc7c22c8a77482d73bfb864b146f7e
          path: .semgrep-rules
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Audit JavaScript dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level high
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep==1.176.1
      - name: Scan relay
        run: >-
          semgrep scan
          --config .semgrep-rules/typescript
          --config .semgrep-rules/javascript
          --error
          --severity ERROR
          --exclude "**/*.test.ts"
          apps/relay/src
